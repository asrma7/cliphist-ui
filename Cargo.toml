[package]
name = "cliphist-ui"
version = "0.1.0"
edition = "2021"
description = "A native GTK4 clipboard history popup for cliphist on Wayland"
license = "MIT"
repository = "https://github.com/asrma7/cliphist-ui"
homepage = "https://github.com/asrma7/cliphist-ui"
readme = "README.md"
keywords = ["clipboard", "cliphist", "gtk4", "wayland", "launcher"]

[dependencies]
anyhow = "1.0"
async-channel = "2.3"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
json5 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
strip = "symbols"
